<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe – v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a12;
      --surface: #13131f;
      --surface2: #1c1c2e;
      --border: #2a2a40;
      --x-color: #ff6b6b;
      --o-color: #4ecdc4;
      --text: #eef0ff;
      --muted: #5a5a80;
      --accent: #f8f32b;
      --accent2: #a78bfa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(167,139,250,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(78,205,196,0.06) 0%, transparent 50%);
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .version-badge {
      background: var(--accent2);
      color: #000;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 3px 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .lang-toggle {
      display: flex;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 1px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    h1 .x { color: var(--x-color); }
    h1 .o { color: var(--o-color); }

    /* ── SCOREBOARD ── */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.5rem;
      width: 100%;
      max-width: 380px;
      margin-bottom: 1.5rem;
    }

    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.8rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .score-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
    }

    .score-card.x-card::after { background: var(--x-color); }
    .score-card.o-card::after { background: var(--o-color); }
    .score-card.draw-card::after { background: var(--muted); }

    .score-label {
      font-size: 0.55rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .score-num {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1;
    }

    .score-card.x-card .score-num { color: var(--x-color); }
    .score-card.o-card .score-num { color: var(--o-color); }
    .score-card.draw-card .score-num { color: var(--muted); }

    /* ── STATUS ── */
    .status {
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
      min-height: 1.3rem;
      text-align: center;
      transition: color 0.3s;
    }

    .status.winner { color: var(--accent); font-weight: 700; }

    /* ── BOARD ── */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 5px;
      margin-bottom: 1.5rem;
    }

    .cell {
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
      position: relative;
    }

    .cell:hover:not(.taken) {
      background: var(--surface2);
      transform: scale(0.96);
    }

    .cell.taken { cursor: default; }

    .cell.x { color: var(--x-color); }
    .cell.o { color: var(--o-color); }

    .cell.winning {
      background: #1a1a08;
      border-color: var(--accent);
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0.55rem 1.2rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover {
      background: var(--surface2);
      border-color: var(--text);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 700;
    }

    button.primary:hover { background: #d4cf00; }

    /* ── HISTORY ── */
    .history-section {
      width: 100%;
      max-width: 380px;
    }

    .history-title {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .history-list {
      list-style: none;
      max-height: 130px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .history-list li {
      font-size: 0.65rem;
      color: var(--muted);
      padding: 0.3rem 0;
      border-bottom: 1px solid #1a1a2a;
      display: flex;
      justify-content: space-between;
    }

    .history-list li .hw { color: var(--accent); }
    .history-list li .hx { color: var(--x-color); }
    .history-list li .ho { color: var(--o-color); }

    footer {
      margin-top: 2rem;
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="version-badge">v2.0 — Pro</div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <h1><span class="x">X</span> Tic Tac Toe <span class="o">O</span></h1>
</header>

<!-- MARCADOR -->
<div class="scoreboard">
  <div class="score-card x-card">
    <div class="score-label">Jugador X</div>
    <div class="score-num" id="score-x">0</div>
  </div>
  <div class="score-card draw-card">
    <div class="score-label" id="label-draw">Empates</div>
    <div class="score-num" id="score-draw">0</div>
  </div>
  <div class="score-card o-card">
    <div class="score-label">Jugador O</div>
    <div class="score-num" id="score-o">0</div>
  </div>
</div>

<div class="status" id="status">Turno de X</div>

<!-- TABLERO -->
<div class="board" id="board">
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>
  <div class="cell" data-index="8"></div>
</div>

<div class="controls">
  <button class="primary" id="btn-reset" onclick="resetGame()">Reiniciar</button>
  <button id="btn-clear" onclick="clearAll()">Borrar todo</button>
</div>

<!-- HISTORIAL -->
<div class="history-section">
  <div class="history-title" id="history-title">Historial de partidas</div>
  <ul class="history-list" id="history-list">
    <li style="color:#3a3a55; justify-content:center;" id="no-games">Sin partidas aún</li>
  </ul>
</div>

<footer>Ingeniería de Software II — Lab 8</footer>

<script>
  // ── TRADUCCIONES ──
  const i18n = {
    es: {
      turn: p => `Turno de ${p}`,
      won: p => `¡Ganó ${p}!`,
      draw: '¡Empate!',
      labelDraw: 'Empates',
      historyTitle: 'Historial de partidas',
      noGames: 'Sin partidas aún',
      reset: 'Reiniciar',
      clearAll: 'Borrar todo',
      histWon: p => `Ganó ${p}`,
      histDraw: 'Empate',
      game: n => `Partida ${n}`,
    },
    en: {
      turn: p => `${p}'s turn`,
      won: p => `${p} wins!`,
      draw: 'Draw!',
      labelDraw: 'Draws',
      historyTitle: 'Match history',
      noGames: 'No games yet',
      reset: 'Restart',
      clearAll: 'Clear all',
      histWon: p => `${p} won`,
      histDraw: 'Draw',
      game: n => `Game ${n}`,
    }
  };

  let lang = 'es';
  let t = i18n[lang];

  function setLang(l) {
    lang = l;
    t = i18n[lang];
    document.getElementById('btn-es').classList.toggle('active', l === 'es');
    document.getElementById('btn-en').classList.toggle('active', l === 'en');
    document.getElementById('label-draw').textContent = t.labelDraw;
    document.getElementById('history-title').textContent = t.historyTitle;
    document.getElementById('btn-reset').textContent = t.reset;
    document.getElementById('btn-clear').textContent = t.clearAll;
    // status
    if (!gameOver) {
      statusEl.textContent = t.turn(currentPlayer);
    }
    // re-render history
    renderHistory();
  }

  // ── JUEGO ──
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0, draw: 0 };
  let history = []; // { winner: 'X'|'O'|null }
  let gameCount = 0;

  const cells = document.querySelectorAll('.cell');
  const statusEl = document.getElementById('status');

  cells.forEach(cell => {
    cell.addEventListener('click', () => {
      const i = parseInt(cell.dataset.index);
      if (gameOver || board[i]) return;

      board[i] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add('taken', currentPlayer.toLowerCase());

      const winCombo = checkWinner();
      if (winCombo) {
        highlight(winCombo);
        statusEl.textContent = t.won(currentPlayer);
        statusEl.classList.add('winner');
        gameOver = true;
        scores[currentPlayer]++;
        updateScores();
        gameCount++;
        history.unshift({ winner: currentPlayer, num: gameCount });
        renderHistory();
        return;
      }

      if (board.every(Boolean)) {
        statusEl.textContent = t.draw;
        statusEl.classList.add('winner');
        gameOver = true;
        scores.draw++;
        updateScores();
        gameCount++;
        history.unshift({ winner: null, num: gameCount });
        renderHistory();
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusEl.textContent = t.turn(currentPlayer);
    });
  });

  function checkWinner() {
    return WINS.find(([a,b,c]) =>
      board[a] && board[a] === board[b] && board[a] === board[c]
    ) || null;
  }

  function highlight(combo) {
    combo.forEach(i => cells[i].classList.add('winning'));
  }

  function updateScores() {
    document.getElementById('score-x').textContent = scores.X;
    document.getElementById('score-o').textContent = scores.O;
    document.getElementById('score-draw').textContent = scores.draw;
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (history.length === 0) {
      list.innerHTML = `<li style="color:#3a3a55;justify-content:center;" id="no-games">${t.noGames}</li>`;
      return;
    }
    list.innerHTML = history.map(h => {
      const label = h.winner
        ? `<span class="h${h.winner.toLowerCase()} hw">${t.histWon(h.winner)}</span>`
        : `<span>${t.histDraw}</span>`;
      return `<li><span>${t.game(h.num)}</span>${label}</li>`;
    }).join('');
  }

  function resetGame() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    statusEl.textContent = t.turn('X');
    statusEl.classList.remove('winner');
  }

  function clearAll() {
    scores = { X: 0, O: 0, draw: 0 };
    history = [];
    gameCount = 0;
    updateScores();
    renderHistory();
    resetGame();
  }
</script>
</body>
</html>
